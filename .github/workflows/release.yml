name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'reports/**'
      - 'AUDIT_REPORT.md'
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Задать версию вручную, например 2.0.0'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        run: |
          git fetch --tags --force
          LAST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          LAST_VERSION=${LAST_TAG#v}
          
          # 1. Check custom manual input
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            NEW_VERSION="${{ github.event.inputs.custom_version }}"
          else
            # 2. Get versions
            CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' MediaTracker.Server/MediaTracker.Server.csproj)
            
            # 3. Calculate auto-increment
            if [ -z "$LAST_VERSION" ]; then
                CALC_VERSION="1.0.0"
            else
                IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
                COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s")
                if echo "$COMMITS" | grep -qE "BREAKING CHANGE|!:"; then
                    CALC_VERSION="$((MAJOR + 1)).0.0"
                elif echo "$COMMITS" | grep -qE "^feat"; then
                    CALC_VERSION="${MAJOR}.$((MINOR + 1)).0"
                else
                    CALC_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                fi
            fi

            # 4. Compare and decide
            if [ "$(printf '%s\n%s' "$CALC_VERSION" "$CSPROJ_VERSION" | sort -V | tail -n1)" = "$CSPROJ_VERSION" ]; then
                NEW_VERSION="$CSPROJ_VERSION"
            else
                NEW_VERSION="$CALC_VERSION"
            fi
          fi
          
          TAG="v$NEW_VERSION"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install Frontend Dependencies
        run: npm --prefix mediatracker-ui ci

      - name: Build Frontend
        run: npm --prefix mediatracker-ui run build

      - name: Publish Server
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p publish/linux-x64
          mkdir -p publish/win-x64
          
          dotnet publish MediaTracker.Server/MediaTracker.Server.csproj -c Release -r linux-x64 --self-contained -p:Version=$VERSION -o publish/linux-x64
          dotnet publish MediaTracker.Server/MediaTracker.Server.csproj -c Release -r win-x64 --self-contained -p:Version=$VERSION -o publish/win-x64
          zip -j tsundoku-linux-x64.zip publish/linux-x64/*
          zip -j tsundoku-win-x64.zip publish/win-x64/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tsundoku ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            tsundoku-linux-x64.zip
            tsundoku-win-x64.zip
