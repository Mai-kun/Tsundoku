name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'reports/**'
      - 'AUDIT_REPORT.md'
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Задать версию вручную, например 2.0.0'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        run: |
          git fetch --tags --force
          LAST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          LAST_VERSION=${LAST_TAG#v}

          # 1. Check custom manual input
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            NEW_VERSION="${{ github.event.inputs.custom_version }}"
          else
            # 2. Get versions
            CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' MediaTracker.Server/MediaTracker.Server.csproj)

            # 3. Calculate auto-increment
            if [ -z "$LAST_VERSION" ]; then
                CALC_VERSION="1.0.0"
            else
                IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
                COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s")
                if echo "$COMMITS" | grep -qE "BREAKING CHANGE|!:"; then
                    CALC_VERSION="$((MAJOR + 1)).0.0"
                elif echo "$COMMITS" | grep -qE "^feat"; then
                    CALC_VERSION="${MAJOR}.$((MINOR + 1)).0"
                else
                    CALC_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                fi
            fi

            # 4. Compare and decide
            if [ "$(printf '%s\n%s' "$CALC_VERSION" "$CSPROJ_VERSION" | sort -V | tail -n1)" = "$CSPROJ_VERSION" ]; then
                NEW_VERSION="$CSPROJ_VERSION"
            else
                NEW_VERSION="$CALC_VERSION"
            fi
          fi

          TAG="v$NEW_VERSION"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build:
    # NativeAOT cannot cross-compile Linux -> Windows without the target OS toolchain,
    # so each RID builds on its own native runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Frontend Dependencies
        run: npm --prefix mediatracker-ui ci

      - name: Build Frontend
        run: npm --prefix mediatracker-ui run build

      # ubuntu-latest ships clang and zlib1g-dev already; windows-latest needs nothing extra.
      - name: Publish Server (NativeAOT)
        run: dotnet publish MediaTracker.Server/MediaTracker.Server.csproj -c Release -r ${{ matrix.rid }} -p:Version=${{ needs.version.outputs.version }} -o publish/${{ matrix.rid }}

      - name: Zip Release (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          cd publish/linux-x64
          zip -r ../../tsundoku-linux-x64.zip .

      # Git Bash on windows-latest has no zip; PowerShell's Compress-Archive is built in.
      - name: Zip Release (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath tsundoku-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tsundoku-${{ matrix.rid }}
          path: tsundoku-${{ matrix.rid }}.zip

  release:
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Tsundoku ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            tsundoku-linux-x64.zip
            tsundoku-win-x64.zip
