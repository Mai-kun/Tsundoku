<!doctype html>
<html lang="ru" style="background-color: #0d0f14">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://shared.fastly.steamstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://s4.anilist.co" />
    <link rel="dns-prefetch" href="https://uploads.mangadex.org" />
    <link rel="dns-prefetch" href="https://avatars.mds.yandex.net" />
    <title>MediaTracker</title>
    <style>
      html,
      body {
        background-color: #0d0f14;
        color: #f3f4f6;
        margin: 0;
      }
      #app:empty {
        display: flex;
        height: 100vh;
        width: 100vw;
        align-items: center;
        justify-content: center;
        background-color: #0d0f14;
      }
      #app:empty::after {
        content: "";
        width: 44px;
        height: 44px;
        border: 3px solid rgba(255, 255, 255, 0.08);
        border-top-color: #5844e0;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body style="background-color: #0d0f14; margin: 0; overflow: hidden">
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
