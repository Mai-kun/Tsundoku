<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tsundoku — Консоль логов</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #090b10;
        color: #f3f4f6;
        font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
        font-size: 12.5px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* ---------- Top bar ---------- */
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 16px;
        background: #12151f;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
      }
      header h1 {
        margin: 0;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.35);
        color: #7dd3fc;
        white-space: nowrap;
      }
      .badge .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #38bdf8;
        animation: pulse 1.6s ease-in-out infinite;
      }
      .badge.stale {
        background: rgba(248, 113, 113, 0.12);
        border-color: rgba(248, 113, 113, 0.35);
        color: #fca5a5;
      }
      .badge.stale .dot {
        background: #f87171;
        animation: none;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .spacer {
        flex: 1;
      }
      button {
        font: inherit;
        font-size: 11.5px;
        padding: 5px 12px;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: #e5e7eb;
        transition:
          background 0.15s,
          border-color 0.15s;
        white-space: nowrap;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.09);
        border-color: rgba(255, 255, 255, 0.22);
      }
      button.active {
        background: rgba(56, 189, 248, 0.15);
        border-color: rgba(56, 189, 248, 0.4);
        color: #7dd3fc;
      }
      input[type="text"] {
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: #f3f4f6;
        outline: none;
        width: 220px;
      }
      input[type="text"]:focus {
        border-color: rgba(56, 189, 248, 0.5);
        background: rgba(255, 255, 255, 0.06);
      }
      input[type="text"]::placeholder {
        color: #6b7280;
      }
      /* ---------- Dual-pane layout ---------- */
      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .logs-pane {
        width: 68%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: #0e1119;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .level-group {
        display: flex;
        gap: 4px;
      }
      .level-group button {
        padding: 5px 10px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      #logs {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px 20px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
      }
      #logs .line {
        padding: 1px 0;
        display: block;
      }
      #logs .ts {
        color: #9ca3af;
      }
      #logs .lvl-inf,
      #logs .lvl-dbg {
        color: #38bdf8;
        font-weight: 700;
      }
      #logs .lvl-wrn {
        color: #fbbf24;
        font-weight: 700;
      }
      #logs .lvl-err,
      #logs .lvl-ftl {
        color: #f87171;
        font-weight: 700;
      }
      #logs .ctx {
        color: #8b8fa3;
      }
      #logs .msg {
        color: #f3f4f6;
      }
      #logs .repeat {
        display: inline-block;
        margin-left: 8px;
        padding: 0 7px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 700;
        background: rgba(139, 143, 163, 0.18);
        border: 1px solid rgba(139, 143, 163, 0.4);
        color: #c3c8d9;
        vertical-align: 1px;
      }
      /* Continuation lines of a multi-line entry (SQL/GraphQL bodies, stack
         traces) render as one soft mono block under the header line. */
      #logs .multiline {
        display: block;
        margin: 3px 0 5px;
        padding: 6px 10px;
        background: rgba(255, 255, 255, 0.035);
        border-left: 2px solid rgba(139, 143, 163, 0.35);
        border-radius: 6px;
        color: #d1d5db;
        font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
      }
      #logs .placeholder {
        color: #6b7280;
        font-style: italic;
      }
      /* ---------- Telemetry sidebar ---------- */
      .telemetry-pane {
        width: 32%;
        overflow-y: auto;
        padding: 14px;
        background: #0b0d13;
      }
      .telemetry-pane h2 {
        margin: 0 0 12px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6b7280;
      }
      .card {
        background: #12151c;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 14px;
      }
      .card h3 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #9ca3af;
      }
      .metric-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 2px 0;
      }
      .metric-label {
        color: #8b8fa3;
        font-size: 11.5px;
      }
      .metric-value {
        color: #f3f4f6;
        font-weight: 700;
        font-size: 13px;
      }
      .metric-value.accent {
        color: #38bdf8;
      }
      .card .kv {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 3px 0;
        font-size: 12px;
      }
      .card .kv .k {
        color: #8b8fa3;
        flex-shrink: 0;
      }
      .card .kv .v {
        color: #e5e7eb;
        text-align: right;
        word-break: break-word;
      }
      .ip-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .ip-row .ip {
        color: #38bdf8;
        font-weight: 700;
        font-size: 14px;
      }
      .icon-btn {
        padding: 4px 8px;
        font-size: 12px;
        line-height: 1;
      }
      .spark-wrap {
        margin-top: 10px;
      }
      .spark-wrap svg {
        display: block;
        width: 100%;
        height: 44px;
      }
      .spark-caption {
        margin-top: 4px;
        font-size: 10.5px;
        color: #6b7280;
      }
      .gpu-name {
        color: #e5e7eb;
        font-size: 12px;
        word-break: break-word;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tsundoku — Консоль логов</h1>
      <span id="status" class="badge"><span class="dot"></span><span id="status-text">Live</span></span>
      <span class="spacer"></span>
    </header>
    <main>
      <section class="logs-pane">
        <div class="toolbar">
          <input id="search" type="text" placeholder="Фильтр по тексту..." />
          <div class="level-group" id="level-group">
            <button data-level="all" type="button" class="active">ALL</button>
            <button data-level="inf" type="button">INF</button>
            <button data-level="wrn" type="button">WRN</button>
            <button data-level="err" type="button">ERR</button>
          </div>
          <span class="spacer"></span>
          <button id="autoscroll" type="button" class="active">Автоскролл: Вкл</button>
          <button id="nowrap" type="button" class="icon-btn" title="Перенос строк" aria-label="Перенос строк" aria-pressed="false">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              style="display: block"
            >
              <path d="M3 6h18" />
              <path d="M3 12h13a3 3 0 1 1 0 6h-4" />
              <path d="m16 16-2-2 2-2" />
              <path d="M3 18h7" />
            </svg>
          </button>
          <button id="copy" type="button">Копировать</button>
          <button id="download" type="button">Скачать</button>
          <button id="clear" type="button">Очистить</button>
        </div>
        <div id="logs"><span class="placeholder">Загрузка логов…</span></div>
      </section>
      <aside class="telemetry-pane">
        <h2>Телеметрия</h2>
        <div class="card">
          <h3>RAM</h3>
          <div class="metric-row">
            <span class="metric-label">Процесс</span>
            <span class="metric-value accent" id="ram-process">— МБ</span>
          </div>
          <div class="metric-row">
            <span class="metric-label">GC Heap</span>
            <span class="metric-value" id="ram-gc">— МБ</span>
          </div>
          <div class="spark-wrap">
            <svg id="ram-spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true">
              <polyline id="spark-area" fill="rgba(56,189,248,0.15)" stroke="none" points="" />
              <polyline
                id="spark-line"
                fill="none"
                stroke="#38bdf8"
                stroke-width="1.5"
                stroke-linejoin="round"
                stroke-linecap="round"
                points=""
              />
            </svg>
            <div class="spark-caption">История за последние 25 секунд</div>
          </div>
        </div>
        <div class="card">
          <h3>GPU</h3>
          <div class="gpu-name" id="gpu-name">—</div>
        </div>
        <div class="card">
          <h3>Сеть</h3>
          <div class="ip-row">
            <span class="metric-label">Local IP</span>
            <span class="ip-row">
              <span class="ip" id="local-ip">—</span>
              <button id="copy-ip" class="icon-btn" type="button" title="Скопировать IP">⧉</button>
            </span>
          </div>
        </div>
        <div class="card">
          <h3>Система</h3>
          <div class="kv"><span class="k">Uptime</span><span class="v" id="uptime">—</span></div>
          <div class="kv"><span class="k">PID</span><span class="v" id="pid">—</span></div>
          <div class="kv"><span class="k">Потоки</span><span class="v" id="threads">—</span></div>
          <div class="kv"><span class="k">База данных</span><span class="v" id="db-size">—</span></div>
          <div class="kv"><span class="k">ОС</span><span class="v" id="os">—</span></div>
          <div class="kv"><span class="k">Архитектура</span><span class="v" id="arch">—</span></div>
        </div>
      </aside>
    </main>

    <script>
      const POLL_INTERVAL_MS = 1500;
      const LEVEL_RE = /\[([0-9:. -]+)\]\s*\[(INF|WRN|ERR|FTL|DBG)\]\s*(\[[^\]]*\]\s*)?([\s\S]*)/;
      const SPARK_HISTORY_MAX = Math.ceil(25000 / POLL_INTERVAL_MS);

      const logsEl = document.getElementById("logs");
      const statusEl = document.getElementById("status");
      const statusText = document.getElementById("status-text");
      const autoscrollBtn = document.getElementById("autoscroll");
      const searchInput = document.getElementById("search");

      let autoScroll = true;
      let lastContent = "";
      let textFilter = "";
      let levelFilter = "all";
      let ramHistory = [];

      function setStale(stale) {
        statusEl.classList.toggle("stale", stale);
        statusText.textContent = stale ? "Нет ответа" : "Live";
      }

      /* ---------- Log stream ---------- */

      // Level filter groups: INF shows INF+DBG, ERR shows ERR+FTL.
      const LEVEL_FILTER_SETS = {
        all: null,
        inf: new Set(["INF", "DBG"]),
        wrn: new Set(["WRN"]),
        err: new Set(["ERR", "FTL"]),
      };

      function render(text) {
        logsEl.textContent = "";
        if (!text.trim()) {
          const p = document.createElement("span");
          p.className = "placeholder";
          p.textContent = "Логи пусты.";
          logsEl.appendChild(p);
          return;
        }

        /* Multi-line payloads (SQL, GraphQL bodies, stack traces) have no
           [timestamp][LEVEL] header of their own: a new entry starts only at a
           LEVEL_RE match, everything else is a continuation of the previous
           entry. That way filters see the whole record, not orphaned lines. */
        const entries = [];
        let current = null;
        for (const rawLine of text.split("\n")) {
          const match = rawLine.match(LEVEL_RE);
          if (match) {
            const [, ts, level, ctx, msg] = match;
            const key = level + "|" + (ctx ?? "") + "|" + msg;
            current = { match, extraLines: [], key, count: 1 };
            entries.push(current);
            continue;
          }
          if (current) {
            current.extraLines.push(rawLine);
            current.key += "\n" + rawLine;
            continue;
          }
          entries.push({ match: null, extraLines: [rawLine], key: "\u0000raw:" + rawLine, count: 1 });
        }

        // Collapse consecutive identical entries: repeated messages merge into
        // one line with an x2/x3 pill. Timestamps are ignored so the same
        // message logged in a burst still deduplicates.
        const deduped = [];
        for (const entry of entries) {
          const last = deduped[deduped.length - 1];
          if (last && last.key === entry.key) {
            last.count += 1;
          } else {
            deduped.push(entry);
          }
        }

        let visible = 0;
        for (const entry of deduped) {
          if (!entry.match) {
            for (const rawLine of entry.extraLines) {
              logsEl.appendChild(renderUnformatted(rawLine));
              visible++;
            }
            continue;
          }
          const [, ts, level, ctx, msg] = entry.match;
          const fullText = msg + (entry.extraLines.length ? "\n" + entry.extraLines.join("\n") : "");
          if (!passesFilter(level, fullText)) continue;
          logsEl.appendChild(renderFormatted(ts, level, ctx, msg, entry.count, entry.extraLines));
          visible++;
        }

        if (visible === 0) {
          const p = document.createElement("span");
          p.className = "placeholder";
          p.textContent = "Нет строк, подходящих под фильтр.";
          logsEl.appendChild(p);
        }
      }

      function passesFilter(level, msg) {
        if (textFilter && !msg.toLowerCase().includes(textFilter)) return false;
        const allowed = LEVEL_FILTER_SETS[levelFilter];
        if (allowed && !allowed.has(level)) return false;
        return true;
      }

      /* Long namespace prefixes ate half the screen, so noisy contexts collapse
         into short badges and everything else keeps only the class name. */
      const CTX_BADGES = [
        ["RequestLoggingMiddleware", "HTTP"],
        ["GlobalExceptionHandler", "EXC"],
      ];

      function compactContext(ctx) {
        const inner = ctx.trim().replace(/^\[/, "").replace(/\]$/, "");
        for (const [needle, badge] of CTX_BADGES) {
          if (inner.includes(needle)) return `[${badge}] `;
        }
        const lastDot = inner.lastIndexOf(".");
        const short = lastDot >= 0 ? inner.slice(lastDot + 1) : inner;
        return `[${short}] `;
      }

      /* The date repeats on every line, so only the time renders; hovering
         shows the full timestamp via title. */
      function compactTimestamp(ts) {
        const trimmed = ts.trim();
        const spaceIdx = trimmed.indexOf(" ");
        return spaceIdx >= 0 ? trimmed.slice(spaceIdx + 1) : trimmed;
      }

      function renderFormatted(ts, level, ctx, msg, count, extraLines) {
        const line = document.createElement("div");
        line.className = "line";
        const tsEl = document.createElement("span");
        tsEl.className = "ts";
        tsEl.textContent = `[${compactTimestamp(ts)}] `;
        tsEl.title = ts.trim();
        const lvlEl = document.createElement("span");
        lvlEl.className = `lvl-${level.toLowerCase()}`;
        lvlEl.textContent = `[${level}] `;
        line.append(tsEl, lvlEl);
        if (ctx) {
          const ctxEl = document.createElement("span");
          ctxEl.className = "ctx";
          ctxEl.textContent = compactContext(ctx);
          ctxEl.title = ctx.trim();
          line.appendChild(ctxEl);
        }
        const msgEl = document.createElement("span");
        msgEl.className = "msg";
        msgEl.textContent = msg;
        line.appendChild(msgEl);
        if (count > 1) {
          const pill = document.createElement("span");
          pill.className = "repeat";
          pill.textContent = `x${count}`;
          pill.title = `Строка повторилась ${count} раз подряд`;
          line.appendChild(pill);
        }
        if (extraLines && extraLines.length > 0) {
          const block = document.createElement("div");
          block.className = "multiline";
          block.textContent = extraLines.join("\n");
          line.appendChild(block);
        }
        return line;
      }

      function renderUnformatted(rawLine) {
        // Multiline exceptions and unformatted lines keep the raw text.
        const line = document.createElement("div");
        line.className = "line";
        line.textContent = rawLine;
        if (/Exception|at System|FTL/.test(rawLine)) {
          line.style.color = "#f87171";
        }
        return line;
      }

      function maybeScroll() {
        if (!autoScroll) return;
        logsEl.scrollTop = logsEl.scrollHeight;
      }

      /* ---------- Telemetry ---------- */

      function renderSparkline() {
        const points = ramHistory;
        const lineEl = document.getElementById("spark-line");
        const areaEl = document.getElementById("spark-area");
        if (points.length < 2) {
          lineEl.setAttribute("points", "");
          areaEl.setAttribute("points", "");
          return;
        }
        const min = Math.min(...points);
        const max = Math.max(...points);
        const range = Math.max(max - min, 4); // avoid a flat line filling the whole box
        const coords = points.map((value, i) => {
          const x = (i / (points.length - 1)) * 100;
          const y = 30 - ((value - min) / range) * 28 - 1;
          return `${x.toFixed(2)},${y.toFixed(2)}`;
        });
        lineEl.setAttribute("points", coords.join(" "));
        areaEl.setAttribute(
          "points",
          `0,32 ${coords.join(" ")} 100,32`,
        );
      }

      function renderTelemetry(data) {
        document.getElementById("ram-process").textContent = `${data.processRamMb} МБ`;
        document.getElementById("ram-gc").textContent = `${data.gcHeapMb} МБ`;
        ramHistory.push(data.processRamMb);
        if (ramHistory.length > SPARK_HISTORY_MAX) ramHistory.shift();
        renderSparkline();

        document.getElementById("local-ip").textContent = data.localIp || "127.0.0.1";
        document.getElementById("uptime").textContent = data.uptime;
        document.getElementById("pid").textContent = data.pid;
        document.getElementById("threads").textContent = data.threads;
        document.getElementById("db-size").textContent = `${data.dbSizeMb} МБ`;
        document.getElementById("os").textContent = data.os;
        document.getElementById("arch").textContent = data.architecture || data.arch || "—";
      }

      function setGpuName(gpu) {
        // Если сервер определил GPU/чип, показываем его; иначе остаётся WebGL-значение.
        if (gpu) document.getElementById("gpu-name").textContent = gpu;
      }

      function getGpuModel() {
        try {
          const canvas = document.createElement("canvas");
          const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
          if (gl) {
            const ext = gl.getExtension("WEBGL_debug_renderer_info");
            if (ext) return gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
          }
        } catch (e) {}
        return "Software / Integrated";
      }

      /* ---------- Polling ---------- */

      async function poll() {
        try {
          const response = await fetch("/api/logs/latest", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const text = await response.text();
          setStale(false);
          if (text !== lastContent) {
            lastContent = text;
            render(text);
            maybeScroll();
          }
        } catch {
          setStale(true);
        }
      }

      async function pollTelemetry() {
        try {
          const response = await fetch("/api/logs/telemetry", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          renderTelemetry(data);
          setGpuName(data.gpu);
        } catch {
          // Telemetry cards keep their last known values on a failed poll.
        }
      }

      /* ---------- Controls ---------- */

      logsEl.addEventListener("scroll", () => {
        const atBottom =
          logsEl.scrollHeight - logsEl.scrollTop - logsEl.clientHeight < 40;
        if (!atBottom && autoScroll) {
          autoScroll = false;
          syncAutoscrollButton();
        }
      });

      function syncAutoscrollButton() {
        autoscrollBtn.textContent = `Автоскролл: ${autoScroll ? "Вкл" : "Выкл"}`;
        autoscrollBtn.classList.toggle("active", autoScroll);
      }

      autoscrollBtn.addEventListener("click", () => {
        autoScroll = !autoScroll;
        syncAutoscrollButton();
        if (autoScroll) maybeScroll();
      });

      /* No-wrap toggle: active mode keeps each log entry on one scrollable line. */
      const nowrapBtn = document.getElementById("nowrap");
      let noWrap = false;
      nowrapBtn.addEventListener("click", () => {
        noWrap = !noWrap;
        nowrapBtn.classList.toggle("active", noWrap);
        nowrapBtn.setAttribute("aria-pressed", String(noWrap));
        logsEl.style.whiteSpace = noWrap ? "pre" : "";
        logsEl.style.overflowX = noWrap ? "auto" : "";
        logsEl.style.wordBreak = noWrap ? "normal" : "";
      });

      document.getElementById("download").addEventListener("click", () => {
        const now = new Date();
        const p = (n) => String(n).padStart(2, "0");
        const stamp = `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}_${p(
          now.getHours(),
        )}-${p(now.getMinutes())}`;
        const blob = new Blob([logsEl.innerText], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `tsundoku-logs-${stamp}.log`;
        link.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById("clear").addEventListener("click", () => {
        logsEl.textContent = "";
        lastContent = "";
      });

      document.getElementById("copy").addEventListener("click", async (event) => {
        const button = event.currentTarget;
        try {
          await navigator.clipboard.writeText(logsEl.innerText);
          button.textContent = "Скопировано ✓";
        } catch {
          button.textContent = "Ошибка копирования";
        }
        setTimeout(() => (button.textContent = "Копировать"), 1500);
      });

      searchInput.addEventListener("input", () => {
        textFilter = searchInput.value.trim().toLowerCase();
        if (lastContent) {
          render(lastContent);
          maybeScroll();
        }
      });

      document.getElementById("level-group").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-level]");
        if (!button) return;
        levelFilter = button.dataset.level;
        for (const b of document.querySelectorAll("#level-group button")) {
          b.classList.toggle("active", b === button);
        }
        if (lastContent) {
          render(lastContent);
          maybeScroll();
        }
      });

      document.getElementById("copy-ip").addEventListener("click", async (event) => {
        const button = event.currentTarget;
        const ip = document.getElementById("local-ip").textContent;
        try {
          await navigator.clipboard.writeText(ip);
          button.textContent = "✓";
        } catch {
          button.textContent = "✗";
        }
        setTimeout(() => (button.textContent = "⧉"), 1500);
      });

      /* ---------- Boot ---------- */

      document.getElementById("gpu-name").textContent = getGpuModel();
      poll();
      pollTelemetry();
      setInterval(poll, POLL_INTERVAL_MS);
      setInterval(pollTelemetry, POLL_INTERVAL_MS);
    </script>
  </body>
</html>
