<path d="M-22 -8 l2 -2.5 M-19 -8 l2 -2.5 M-16 -8 l2 -2.5 M16 -8 l2 -2.5 M19 -8 l2 -2.5 M22 -8 l2 -2.5" stroke="#ff7f92" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
