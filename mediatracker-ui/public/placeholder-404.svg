<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">404 — Page not found</title>
<desc id="d">A chibi cat-eared girl with a magnifying glass looks around, confused, searching for a missing page.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#12151c"/>
<stop offset="1" stop-color="#1c1f2b"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
<stop offset="0" stop-color="#5844e0" stop-opacity="0.38"/>
<stop offset="1" stop-color="#5844e0" stop-opacity="0"/>
</radialGradient>
<radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
<stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
<stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
</radialGradient>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
<rect width="4" height="1" fill="#ffffff" fill-opacity="0.025"/>
</pattern>
<linearGradient id="hair" gradientUnits="userSpaceOnUse" x1="0" y1="-86" x2="0" y2="20">
<stop offset="0" stop-color="#a99cff"/>
<stop offset="0.5" stop-color="#7b69ff"/>
<stop offset="1" stop-color="#5844e0"/>
</linearGradient>
<linearGradient id="hairBack" gradientUnits="userSpaceOnUse" x1="0" y1="-70" x2="0" y2="20">
<stop offset="0" stop-color="#6553ea"/>
<stop offset="1" stop-color="#3b2ca6"/>
</linearGradient>
<linearGradient id="earIn" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffb3c4"/>
<stop offset="1" stop-color="#c9a5ff"/>
</linearGradient>
<linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#241f48"/>
<stop offset="0.55" stop-color="#5844e0"/>
<stop offset="1" stop-color="#b6abff"/>
</linearGradient>
<path id="spark" d="M0 -5 1.2 -1.2 5 0 1.2 1.2 0 5 -1.2 1.2 -5 0 -1.2 -1.2Z"/>
</defs>

<!-- background -->
<rect width="300" height="450" fill="url(#bg)"/>
<rect width="300" height="450" fill="url(#glow)"/>
<rect width="300" height="450" fill="url(#scan)"/>
<rect width="300" height="450" fill="url(#vignette)"/>

<!-- sparkles -->
<g fill="#c9c1ff">
