<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>layout diag (temporary)</title>
    <style>
      body { margin: 0; background: #000; color: #4ade80; font: 13px/1.3 ui-monospace, Consolas, monospace; }
      iframe { border: 0; background: #0c0e14; display: block; }
      pre { margin: 0; padding: 6px; white-space: pre; }
    </style>
  </head>
  <body>
    <pre id="out">pending</pre>
    <div id="host"></div>
    <script>
      const params = new URLSearchParams(location.search)
      const width = Number(params.get('w') || 390)
      const view = params.get('view') || 'home'
      const open = params.get('open') || ''
      const press = params.get('press') || ''
      const lang = params.get('lang') || ''
      const out = []

      const frame = document.createElement('iframe')
      frame.style.width = width + 'px'
      frame.style.height = Number(params.get('h') || 844) + 'px'
      document.getElementById('host').appendChild(frame)

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
      const box = (el) => {
        const r = el.getBoundingClientRect()
        return `x=${Math.round(r.x)} y=${Math.round(r.y)} w=${Math.round(r.width)} h=${Math.round(r.height)} right=${Math.round(r.right)} bottom=${Math.round(r.bottom)}`
      }
      const say = (label, el) => (el ? out.push(`${label}: ${box(el)}`) : out.push(`${label}: MISSING`))
      const cls = (el) => String(el.getAttribute('class') || '').slice(0, 40)
      const describe = (el) => (el ? `${el.tagName.toLowerCase()}${el.id ? '#' + el.id : ''} [${el.getAttribute('aria-label') || el.getAttribute('placeholder') || el.textContent.trim().slice(0, 24)}] cls=${cls(el)}` : 'null')

      function overflowScan(doc, iw, root, label) {
        const list = []
        ;(root || doc.body).querySelectorAll('*').forEach((el) => {
          const r = el.getBoundingClientRect()
          if (r.width > 0 && r.height > 0 && (r.right > iw + 1 || r.left < -1)) {
            list.push(`${el.tagName.toLowerCase()}.${cls(el)} left=${Math.round(r.left)} right=${Math.round(r.right)} w=${Math.round(r.width)}`)
          }
        })
        out.push(`${label}_OVERFLOW=${list.length}`)
        out.push(...list.slice(0, 10))
      }
      async function run() {
        try {
          await new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }))
          await wait(2500)
          const doc = frame.contentDocument
          const win = frame.contentWindow
          const iw = win.innerWidth
          out.push(`--- view=${view} w=${width} viewport=${iw}x${win.innerHeight} open=${open} press=${press} lang=${lang}`)
          out.push(`docScrollWidth=${doc.documentElement.scrollWidth} clientWidth=${doc.documentElement.clientWidth}`)
          say('aside', doc.querySelector('aside'))
          say('header', doc.querySelector('header'))
          say('main', doc.querySelector('main'))
          const nav = doc.querySelector('nav')
          say('nav', nav)
          if (nav) {
            const mb = nav.querySelectorAll('button')
            say('navFirst', mb[0])
            say('navLast', mb[mb.length - 1])
          }
          const menuBtn = doc.querySelector('aside div.lg\\:hidden button')
          say('toolsButton', menuBtn)
          say('toolsWrap', doc.querySelector('aside div.lg\\:hidden'))
          const grid = doc.querySelector('main .grid')
          if (grid) {
            say('grid', grid)
            const cards = Array.from(grid.children)
            if (cards[0]) say('card0', cards[0])
            if (cards[cards.length - 1]) say('cardLast', cards[cards.length - 1])
          }
          overflowScan(doc, iw, doc.body, 'PAGE')
          out.push(`h1text=${doc.querySelector('h1') ? doc.querySelector('h1').textContent.trim() : '-'}`)
          out.push(`navLabels=${Array.from(doc.querySelectorAll('nav button')).map((b) => b.textContent.trim() || b.getAttribute('aria-label') || '?').join(',')}`)

          if (lang) {
            const select = doc.querySelector('select#language-select')
            if (select) {
              select.value = lang
              select.dispatchEvent(new win.Event('change', { bubbles: true }))
              await wait(500)
              out.push(`AFTER_LANG h1text=${doc.querySelector('h1').textContent.trim()}`)
              out.push(`AFTER_LANG navLabels=${Array.from(doc.querySelectorAll('nav button')).map((b) => b.textContent.trim() || b.getAttribute('aria-label') || '?').join(',')}`)
              out.push(`AFTER_LANG mainText=${doc.querySelector('main').textContent.replace(/\s+/g, ' ').trim().slice(0, 100)}`)
            }
            else {
              out.push('AFTER_LANG select MISSING')
            }
          }
          if (open === 'create' || open === 'search') {
            const headerDiv = doc.querySelector('header > div')
            const btn = open === 'create'
              ? headerDiv.querySelector('button:last-child')
              : doc.querySelector('header button[title], header button[aria-label]')
            out.push(`CLICK target=${describe(btn)}`)
            if (btn) btn.click()
            await wait(700)
            const dialogs = doc.querySelectorAll('[role="dialog"]')
            out.push(`DIALOG_COUNT=${dialogs.length}`)
            const dialog = dialogs[0]
            if (dialog) {
              say('dialog', dialog)
              say('dialogInner', dialog.querySelector('div'))
              const scrollable = Array.from(dialog.querySelectorAll('*')).filter((el) => el.scrollHeight > el.clientHeight + 4)
              out.push(`DIALOG_SCROLLERS=${scrollable.length}`)
              scrollable.slice(0, 3).forEach((el) => out.push(`  scroller ${el.tagName.toLowerCase()}.${cls(el)} scrollH=${el.scrollHeight} clientH=${el.clientHeight}`))
              overflowScan(doc, iw, doc.body, 'DIALOG')
              out.push(`FOCUS_ON_OPEN=${describe(doc.activeElement)}`)
              const buttons = Array.from(dialog.querySelectorAll('button'))
              out.push(`DIALOG_BUTTONS=${buttons.length}`)
              buttons.slice(0, 3).forEach((b, i) => out.push(`  btn${i} ${describe(b)}`))
              const inputs = Array.from(dialog.querySelectorAll('input,select,textarea'))
              out.push(`DIALOG_FIELDS=${inputs.length}`)
              inputs.slice(0, 5).forEach((f, i) => out.push(`  field${i} ${describe(f)}`))
            }
            if (press === 'escape') {
              const ev = new win.KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', keyCode: 27, bubbles: true, cancelable: true })
              doc.body.dispatchEvent(ev)
              win.dispatchEvent(ev)
              await wait(600)
              out.push(`AFTER_ESCAPE_DIALOGS=${doc.querySelectorAll('[role="dialog"]').length}`)
              out.push(`AFTER_ESCAPE_FOCUS=${describe(doc.activeElement)}`)
            }
          }

          if (press === 'ctrl+k') {
            const ev = new win.KeyboardEvent('keydown', { key: 'k', code: 'KeyK', keyCode: 75, ctrlKey: true, bubbles: true, cancelable: true })
            win.dispatchEvent(ev)
            doc.body.dispatchEvent(ev)
            await wait(700)
            out.push(`AFTER_CTRLK_DIALOGS=${doc.querySelectorAll('[role="dialog"]').length}`)
            say('ctrlkDialog', doc.querySelector('[role="dialog"]'))
            out.push(`AFTER_CTRLK_FOCUS=${describe(doc.activeElement)}`)
          }

          if (press === 'tools') {
            const toolsBtn = doc.querySelector('aside div.lg\\:hidden button')
            if (toolsBtn) {
              toolsBtn.click()
              await wait(500)
              const panel = doc.querySelector('aside div.absolute')
              out.push(`TOOLS_OPEN=${panel ? 'yes' : 'no'}`)
              say('toolsPanel', panel)
              out.push(`TOOLS_ARIA_EXPANDED=${toolsBtn.getAttribute('aria-expanded')}`)
              overflowScan(doc, iw, doc.body, 'TOOLS')
            }
            else {
              out.push('TOOLS_OPEN=no-button')
            }
          }
        } catch (err) {
          out.push('ERROR ' + err.message)
        }
        const text = out.join('\n')
        document.getElementById('out').textContent = text
        const flat = text.replace(/\n/g, ' | ')
        const chunks = flat.match(/[\s\S]{1,650}/g) || []
        chunks.forEach((chunk, i) => {
          fetch('/api/media/?diag=' + i + ':' + encodeURIComponent(chunk)).catch(() => {})
        })
      }

      frame.src = '/?view=' + encodeURIComponent(view)
      run()

  </body>
</html>
